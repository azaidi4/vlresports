services:
  vlr-esports:
    container_name: vlr-server
    build: .
    volumes:
      - .:/app
      - /app/node_modules
    command: npm run dev
    depends_on:
      - vlr-redis
    ports:
      - '5000:5000'
    restart: always
    environment:
      - TZ=Asia/Kolkata

  vlr-redis:
    container_name: vlr-redis
    image: 'redis/redis-stack'
    ports:
      - 6379:6379
      - 8001:8001
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli ping | grep PONG']
      interval: 1s
      timeout: 3s
      retries: 5
    volumes:
      - ./redisdata:/data
    environment:
      - TZ=Asia/Kolkata
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
